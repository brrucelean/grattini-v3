<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- iPhone: full-screen, niente zoom-pinch, safe-area sotto il notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Grattini V3</title>
    <meta name="description" content="Grattini V3 — roguelike italiano di gratta-e-vinci, combattimenti, personaggi e biglietti da grattare." />
    <meta property="og:title" content="Grattini V3" />
    <meta property="og:description" content="Roguelike italiano di gratta-e-vinci — rework combat: duello a HP, minigiochi di tempismo." />
    <meta property="og:type" content="website" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        /* overflow hidden su body: il game frame si estende con position:absolute inset:0
           così non servono mai unità vh che su iOS Safari sono sbagliate */
        overflow: hidden;
        background: #000000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%; height: 100%;
        overflow: hidden;
        /* NON mettere padding safe-area qui: il game div è position:fixed
           relativo al viewport, non a #root, quindi il padding sarebbe ignorato.
           Le safe-area sono gestite internamente dal componente Grattini via
           env(safe-area-inset-top/bottom) sullo S.container. */
      }
      /* Vetro CRT su tutto il gioco: righe orizzontali sopra ogni schermata,
         modali e tooltip compresi. pointer-events:none → clic e grattate
         passano attraverso. Richiesto dall'utente dopo il tabaccaio. */
      body::after {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2147483647;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
